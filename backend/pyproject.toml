[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bnbot"
version = "0.0.0"
description = "Bot de trade para Binance Spot — Fase 0: análise da conta (somente leitura)."
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.3",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-socket>=0.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["analysis*", "core*", "exchange*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--disable-socket --strict-markers"
